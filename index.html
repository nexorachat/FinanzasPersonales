<script>

var AVISO='<p class="aviso">Contenido informativo y educativo. No constituye asesoramiento financiero, fiscal ni legal personalizado. Las cifras y la normativa pueden cambiar: verifícalas en fuentes oficiales.</p>';

var A=[
{id:"ahorrar-300",cat:"Ahorro",t:"Cómo ahorrar 300 € al mes en España: método paso a paso",d:"Presupuesto, regla 50/30/20, ahorro automático y recortes que sí funcionan.",
b:`<p>Ahorrar no consiste en privarse de todo, sino en ordenar tus gastos y decidir antes de gastar. Este es el método más sencillo.</p>
<h2>1. Calcula tus ingresos y gastos reales</h2><p>Apunta durante un mes todo lo que gastas, hasta los cafés. Casi todo el mundo descubre suscripciones olvidadas y gastos hormiga que suman fácilmente entre 80 y 150 € al mes.</p>
<h2>2. Aplica la regla 50/30/20</h2><p>Destina el 50 % de tus ingresos netos a necesidades (vivienda, comida, transporte), el 30 % a ocio y el 20 % a ahorro o inversión. Con un sueldo neto de 1.500 €, el 20 % son justo 300 €.</p>
<h2>3. Automatiza el ahorro</h2><p>Programa una transferencia el día que cobras hacia una cuenta aparte. Pagarte primero a ti evita que el dinero se diluya en gastos.</p>
<h2>4. Revisa tus gastos fijos una vez al año</h2><p>Luz, gas, internet, móvil y seguros son los gastos donde más se puede recortar sin cambiar de vida. Comparar tarifas puede suponer entre 200 y 500 € al año.</p>
<h2>5. Construye tu fondo de emergencia primero</h2><p>Antes de invertir, reserva el equivalente a varios meses de gastos básicos. Lo explicamos en nuestra guía del fondo de emergencia.</p>`},
{id:"fondo-emergencia",cat:"Ahorro",t:"Fondo de emergencia: cuánto necesitas y dónde guardarlo",d:"Qué es, cuántos meses de gastos debes reservar y qué opciones hay en España.",
b:`<p>El fondo de emergencia es dinero reservado para imprevistos: perder el empleo, una avería o un gasto médico. No es una inversión, es tu seguro personal.</p>
<h2>¿Cuánto debe ser?</h2><p>La recomendación habitual es cubrir entre 3 y 6 meses de gastos básicos. Si tienes ingresos variables, hijos o un solo sueldo en casa, conviene acercarse a los 6 meses o más. Si tus gastos esenciales son 1.200 € al mes, el objetivo estaría entre 3.600 y 7.200 €.</p>
<h2>¿Dónde guardarlo?</h2><p>Debe ser dinero disponible y sin riesgo de pérdida: una cuenta de ahorro o una cuenta remunerada. No lo metas en bolsa, porque podría estar en pérdidas justo cuando lo necesites.</p>
<h2>Cómo construirlo</h2><p>Empieza con un primer objetivo pequeño, como un mes de gastos, y ve ampliando con una aportación automática mensual.</p>`},
{id:"cuentas-remuneradas",cat:"Ahorro",t:"Cuentas remuneradas: cómo elegir la mejor en España",d:"Qué mirar antes de abrir una y cómo funciona la garantía de depósitos.",
b:`<p>Una cuenta remunerada paga intereses por el dinero que mantienes en ella y suele permitir sacarlo en cualquier momento.</p>
<h2>Qué mirar antes de abrirla</h2><p>Fíjate en el TAE (la rentabilidad anual real), en si el tipo es temporal o permanente, en si exige domiciliar la nómina o contratar otros productos, y en el saldo máximo que se remunera.</p>
<h2>Garantía de depósitos</h2><p>Los depósitos en entidades españolas están cubiertos por el Fondo de Garantía de Depósitos hasta 100.000 € por titular y entidad.</p>
<h2>Cuentas, depósitos y fondos monetarios</h2><p>El depósito a plazo fija la rentabilidad pero bloquea el dinero. Los fondos monetarios no tienen la garantía de depósitos. Para el fondo de emergencia, prima la liquidez.</p>
<h2>Consejo</h2><p>Los tipos cambian con frecuencia: compara siempre las condiciones actuales en la web oficial de cada banco.</p>`},
{id:"fondos-indexados",cat:"Inversión",t:"Fondos indexados para principiantes: qué son y cómo empezar",d:"Ventajas, riesgos y primeros pasos para invertir desde cero.",
b:`<p>Un fondo indexado replica un índice bursátil, como el MSCI World o el S&amp;P 500, en lugar de intentar batirlo. Por eso tiene comisiones bajas y diversificación automática.</p>
<h2>Ventajas</h2><p>Comisiones reducidas (a menudo por debajo del 0,5 % anual frente a más del 1,5 % de muchos fondos activos), diversificación global en miles de empresas y muy poco tiempo de gestión.</p>
<h2>Riesgos</h2><p>El valor puede bajar, incluso un 30 % o más en una crisis, y no existe rentabilidad garantizada. Invierte solo dinero que no vayas a necesitar durante años.</p>
<h2>Primeros pasos</h2><p>Define tu horizonte temporal, elige un bróker regulado, compara comisiones y aporta de forma periódica. Hacerlo todos los meses reduce el riesgo de entrar en el peor momento.</p>
<h2>Fiscalidad</h2><p>En España los fondos permiten traspasar entre fondos sin tributar hasta que se reembolsa, una ventaja frente a otros productos.</p>`},
{id:"etf-vs-fondos",cat:"Inversión",t:"ETF o fondos indexados: diferencias y cuál te conviene",d:"Comparativa de costes, fiscalidad y comodidad para el inversor en España.",
b:`<p>Ambos replican índices con comisiones bajas, pero funcionan de forma distinta.</p>
<h2>Cómo se compran</h2><p>Los fondos indexados se suscriben a precio de cierre del día. Los ETF cotizan en bolsa durante toda la sesión, como una acción.</p>
<h2>Fiscalidad en España</h2><p>Los fondos permiten traspasos sin tributar. Los ETF no: al venderlos se paga impuesto por la ganancia, aunque reinviertas el dinero.</p>
<h2>Aportaciones periódicas</h2><p>Los fondos son más cómodos para aportar importes fijos al mes, incluso pequeños. En los ETF pueden aplicarse comisiones por operación.</p>
<h2>Conclusión</h2><p>Para quien empieza y aporta cada mes, los fondos indexados suelen ser más sencillos y fiscalmente eficientes. Los ETF encajan en carteras con más control o con aportaciones grandes.</p>`},
{id:"inflacion",cat:"Economía",t:"Qué es la inflación y cómo afecta a tus ahorros",d:"Entiende por qué el dinero pierde valor y cómo protegerte.",
b:`<p>La inflación es la subida generalizada de precios. Si los precios suben un 3 % y tu dinero rinde un 0 %, cada año compras un 3 % menos.</p>
<h2>Un ejemplo</h2><p>Con una inflación media del 3 % anual, 10.000 € parados durante 10 años equivaldrían a un poder de compra cercano a 7.400 € de hoy.</p>
<h2>Cómo se mide</h2><p>En España la mide el INE con el IPC, y puedes consultar los datos actualizados en su web.</p>
<h2>Cómo protegerte</h2><p>Mantén el fondo de emergencia en una cuenta que rinda algo, y destina a inversión diversificada el dinero que no necesitarás a largo plazo, donde históricamente la renta variable ha superado a la inflación, aunque sin garantías.</p>
<h2>Idea clave</h2><p>Guardar dinero sin rentabilidad no es neutro: tiene un coste oculto.</p>`},
{id:"hipoteca-fija-variable",cat:"Vivienda",t:"Hipoteca fija o variable: ventajas, riesgos y cómo decidir",d:"Diferencias entre tipos, el Euríbor y qué mirar antes de firmar.",
b:`<p>Elegir el tipo de hipoteca es una de las decisiones financieras más importantes de tu vida.</p>
<h2>Hipoteca fija</h2><p>La cuota es siempre la misma. Da tranquilidad y facilita planificar, pero el tipo inicial suele ser algo mayor que el de la variable.</p>
<h2>Hipoteca variable</h2><p>Se calcula con el Euríbor más un diferencial, y se revisa normalmente cada 6 o 12 meses. Puede salir más barata, pero si el Euríbor sube, la cuota también.</p>
<h2>Hipoteca mixta</h2><p>Combina unos años a tipo fijo y el resto a variable.</p>
<h2>Qué revisar antes de firmar</h2><p>Compara el TAE, no solo el tipo; revisa las comisiones de apertura y amortización anticipada, y los productos vinculados que te exijan contratar. Pide la FEIN, documento oficial que detalla las condiciones.</p>
<h2>Regla práctica</h2><p>Valora que tu cuota, sumada a otras deudas, no supere aproximadamente un tercio de tus ingresos netos.</p>`},
{id:"salir-de-deudas",cat:"Deudas",t:"Cómo salir de deudas: método bola de nieve y avalancha",d:"Dos estrategias para pagar tus deudas más rápido y con menos estrés.",
b:`<p>Salir de deudas requiere un plan. Estos dos métodos son los más conocidos.</p>
<h2>Paso previo: haz la lista</h2><p>Apunta cada deuda con su saldo, tipo de interés y cuota mínima. Muchas tarjetas revolving superan el 20 % de TAE, así que suelen ser las más urgentes.</p>
<h2>Método avalancha</h2><p>Pagas el mínimo en todas y destinas el dinero extra a la deuda con mayor interés. Es el que menos intereses genera en total.</p>
<h2>Método bola de nieve</h2><p>Atacas primero la deuda más pequeña, sin importar el interés. Cada deuda eliminada motiva y libera cuota para la siguiente.</p>
<h2>Consejos extra</h2><p>Evita contraer nuevas deudas mientras pagas, negocia intereses con tu banco y, si no llegas a fin de mes, consulta con un servicio de asesoramiento al consumidor antes de recurrir a préstamos rápidos.</p>`},
{id:"seguro-coche",cat:"Seguros",t:"Seguro de coche: tipos de cobertura y cómo ahorrar al contratarlo",d:"Terceros, ampliado y todo riesgo explicados, y consejos para pagar menos.",
b:`<p>En España el seguro de responsabilidad civil obligatoria es imprescindible para circular. A partir de ahí, hay varios niveles.</p>
<h2>Tipos de seguro</h2><p><strong>A terceros básico:</strong> cubre los daños que causes a otros. <strong>Terceros ampliado:</strong> añade lunas, robo o incendio. <strong>Todo riesgo:</strong> cubre también tus propios daños, con o sin franquicia.</p>
<h2>Cómo elegir</h2><p>Un coche antiguo y de poco valor rara vez compensa con todo riesgo. En un coche nuevo o financiado, suele merecer la pena.</p>
<h2>Cómo pagar menos</h2><p>Compara varias aseguradoras cada año, elige una franquicia mayor si puedes asumirla, ajusta el kilometraje y no declares coberturas que no necesitas. Revisa las condiciones de la asistencia en carretera.</p>
<h2>Antes de contratar</h2><p>Lee el condicionado y fíjate en exclusiones y límites, no solo en el precio.</p>`},
{id:"impuestos-inversion",cat:"Impuestos",t:"Impuestos de las inversiones en España: cómo tributan tus ganancias",d:"Tramos del IRPF del ahorro y cuándo hay que declarar.",
b:`<p>Las ganancias de tus inversiones tributan en la base del ahorro del IRPF, con tipos progresivos que conviene conocer.</p>
<h2>Tramos aplicables</h2><p>Con la escala vigente en los últimos años: 19 % hasta 6.000 €; 21 % de 6.000 a 50.000 €; 23 % de 50.000 a 200.000 €; 27 % de 200.000 a 300.000 € y 30 % por encima. Verifica siempre la escala vigente en la Agencia Tributaria.</p>
<h2>Cuándo tributas</h2><p>Solo cuando hay una ganancia realizada: al vender acciones o ETF, o al reembolsar un fondo. Los traspasos entre fondos no tributan.</p>
<h2>Intereses y dividendos</h2><p>Los intereses de cuentas y los dividendos también tributan en la base del ahorro y suelen llevar retención.</p>
<h2>Declaración de la renta</h2><p>La campaña suele desarrollarse entre abril y junio. Guarda siempre los justificantes de compra y venta.</p>`}
];

var P={
"sobre-nosotros":["Sobre nosotros","<p>AhorraClaro es un proyecto editorial de divulgación sobre finanzas personales en España. Escribimos guías claras, con datos contrastados y sin promesas de dinero fácil. [Cuenta aquí quién eres, tu experiencia y por qué creaste la web.]</p><h2>Nuestra política editorial</h2><p>No recomendamos productos concretos a cambio de comisiones, no prometemos rentabilidades y actualizamos las guías cuando cambia la normativa.</p>"],
"contacto":["Contacto","<p>Para consultas, correcciones o colaboraciones, escríbenos a <strong>tuemail@tudominio.com</strong>. Respondemos en un plazo de 2 a 3 días laborables.</p>"],
"politica-privacidad":["Política de privacidad","<p>Responsable: [Tu nombre], [email]. Recopilamos datos de navegación mediante cookies y servicios de terceros como Google Analytics y Google AdSense. Google, como proveedor externo, utiliza cookies para mostrar anuncios basados en visitas previas. Puedes desactivar la publicidad personalizada en <a href='https://adssettings.google.com'>adssettings.google.com</a>. Tienes derecho de acceso, rectificación, supresión, limitación y oposición escribiendo a nuestro email, conforme al RGPD y la LOPDGDD.</p>"],

"aviso-legal":["Aviso legal","<p>Titular: [Nombre y apellidos], NIF [tu NIF], email [email]. Los contenidos son informativos y no constituyen asesoramiento financiero. Queda prohibida su reproducción sin autorización. Este sitio se rige por la LSSI-CE.</p>"]
};

var app=document.getElementById("app");
function card(a){return '<div class="card"><span class="tag">'+a.cat+'</span><h2><a href="#'+a.id+'">'+a.t+'</a></h2><p>'+a.d+'</p></div>';}
function mins(a){return Math.max(1,Math.round(a.b.replace(/<[^>]+>/g," ").split(/\s+/).length/200));}
function setSEO(t,d){document.title=t+" | AhorraClaro";document.querySelector('meta[name=description]').content=d;}

function home(){
  setSEO("Finanzas personales para España","Guías de ahorro, inversión, hipotecas, seguros e impuestos explicadas con datos.");
  app.innerHTML='<div class="hero"><h1>Finanzas personales explicadas sin complicaciones</h1><p>Guías prácticas, con datos y sin promesas de dinero fácil, sobre ahorro, inversión, hipotecas, seguros e impuestos.</p></div>'+
  '<div class="calc"><h2>Calculadora de ahorro e inversión</h2>'+
  '<label>Capital inicial (€)</label><input id="c1" type="number" value="1000">'+
  '<label>Aportación mensual (€)</label><input id="c2" type="number" value="200">'+
  '<label>Años</label><input id="c3" type="number" value="10">'+
  '<label>Rentabilidad anual estimada (%)</label><input id="c4" type="number" value="5" step="0.1">'+
  '<button onclick="calc()">Calcular</button><div id="res"></div><p class="meta">Simulación ilustrativa: no garantiza resultados reales.</p></div>'+
  '<input id="q" placeholder="Buscar artículos...">'+'<div id="lista">'+A.map(card).join("")+'</div>';
  document.getElementById("q").oninput=function(){
    var v=this.value.toLowerCase();
    document.getElementById("lista").innerHTML=A.filter(function(a){return (a.t+a.d+a.cat).toLowerCase().indexOf(v)>-1;}).map(card).join("")||"<p>No hay resultados.</p>";
  };
}
function calc(){
  var c=+c1.value,m=+c2.value,y=+c3.value,r=+c4.value/100/12,n=y*12,t=c,i;
  for(i=0;i<n;i++){t=t*(1+r)+m;}
  var ap=c+m*n;
  res.innerHTML="Aportado: "+ap.toLocaleString("es-ES",{maximumFractionDigits:0})+" € · Resultado estimado: "+t.toLocaleString("es-ES",{maximumFractionDigits:0})+" € · Intereses: "+(t-ap).toLocaleString("es-ES",{maximumFractionDigits:0})+" €";
}
function article(a){
  setSEO(a.t,a.d);
  var rel=A.filter(function(x){return x.id!==a.id;}).sort(function(x,y){return (y.cat===a.cat)-(x.cat===a.cat);}).slice(0,3);
  app.innerHTML='<p><a href="#inicio">← Inicio</a></p><span class="tag">'+a.cat+'</span><h1>'+a.t+'</h1><p class="meta">Actualizado: octubre 2026 · '+mins(a)+' min de lectura</p>'+a.b+AVISO+'<h2>Artículos relacionados</h2>'+rel.map(card).join("");
}
function route(){
  var id=location.hash.slice(1)||"inicio",a=A.filter(function(x){return x.id===id;})[0];
  if(a)article(a);else if(P[id]){setSEO(P[id][0],P[id][0]);app.innerHTML="<h1>"+P[id][0]+"</h1>"+P[id][1];}else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();

function cargarAdsense(){
  if(ADSENSE_ID.indexOf("XXXX")>-1)return;
  var s=document.createElement("script");s.async=true;s.crossOrigin="anonymous";
  s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+ADSENSE_ID;
  document.head.appendChild(s);
}
var e=null;try{e=localStorage.getItem("cookies");}catch(x){}
if(!e)document.getElementById("cookies").style.display="block";
if(e==="si")cargarAdsense();
document.getElementById("ok").onclick=function(){try{localStorage.setItem("cookies","si");}catch(x){}document.getElementById("cookies").style.display="none";cargarAdsense();};
document.getElementById("no").onclick=function(){try{localStorage.setItem("cookies","no");}catch(x){}document.getElementById("cookies").style.display="none";};
</script>
